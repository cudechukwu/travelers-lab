name: Sean Perrone
group: network
role: Professor of History
institution: Saint Anselm College
photo: /media/people/Perrone.jpg
bio: Research has focused on the financial negotiations between the Castilian Crown and the Assembly of the Clergy in the sixteenth century. In recent years, Sean Perrone has been working on a project to map royal finances and the collection of ecclesiastical subsidies in the early 1500s. Right now he is working with history and computer science students to map monasteries that contributed to the ecclesiastical subsidies as well as monasteries along the Camino de Santiago in ArcGIS.
order: 7
