bio: "addresses these challenges on three levels: in the theorisation of digital history, in its methods and practices, as well as in its dissemination in academic teaching and to society. The conceptualisation of change under the conditions of digitality is therefore at the centre of her scientific work. Seizing and utilizing the possibilities of digital media for researching the relation of space and time is one of her research foci. A sustainable society needs the analytical reflection and scientific guidance of the digital transformation that humanities can provide. Silke Schwandt develops creative and innovative formats with a focus on Data Literacy as well as new digital publication formats. Current projects focus on designing digital workflows in the context of medieval English court records (The FLOW Project). Past projects have included also the development of VR applications for data exploration in history (See the virtual reality eTaRDiS Project)."
