bio: Within medieval history, Gary Shaw’s current research interests include the circulation of people, things, animals, and ideas in later medieval England, and it is in this area that his interest in the Travelers Lab began. His current book project on this topic is tentatively called “Travelling to the Future. Networks of Modernity in Medieval England,” and several aspects have spawned additional research plans that the Travelers Lab will attempt to pursue. These will include the Database of Medieval Mobility, The English Friars Settlement project, the Episcopal Travel project, a project on aspects of judicial mobility, and the mapping of centers of accommodation and hospitality. Methodologically, his work has heavily used GIS solutions, but we anticipate further work involving increasing network analysis in the coming years.
