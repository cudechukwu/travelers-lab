bio: Pinch’s work in the Traveler’s Lab focuses on the detailed journals and reports of Francis Buchanan (later Hamilton), surgeon and botanist, produced between 1807 and 1814 while in the service of the East India Company. Building on work done for his 1996 book, Peasants and Monks in British India (see here and here), Pinch and student Rachel Liu are producing GIS maps that aim to capture the myriad details of Buchanan’s travels through Bihar in north India—including the quality of roads, naming conventions, flora and fauna, built environment, notable encounters, and topography. In addition, they hope to produce a map of “sectarian influence” in south Bihar that focuses on the social roles of ascetics and holy men (and some women) and the ascetic networks and institutions that sustained them, about which Buchanan provided remarkably detailed information. This map will accompany a book chapter by Pinch for the Cambridge History of the Modern Indian Subcontinent (scheduled for 2022).
