bio: Charlotte Seal is an enthusiastic member, exploring her passion for literature and cultural studies. Engaged in campus life, Charlotte contributes to Wesleyan University Press, the Wesleyan Argus, Route 9, and assists peers through the Wesleyan ITS Helpdesk. Previously, she collaborated with Professor Torgerson on a project for the Center for Digital Education and Research, focusing on manuscript identification. Currently, Charlotte is involved in the Offices project at Traveler’s, exploring the identification of individuals’ offices through associated seals.
