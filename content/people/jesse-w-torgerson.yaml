bio: "The possibility of travel rests on spaces through which to move, which is the focus of the C-DER Project (Constantinopolitana: Database of East Rome). C-DER grew out of the student-centered map-based encyclopedia Constantinople as Palimpsest (conjoined with the Wesleyan course Constantinople: between Rome and Istanbul). This ongoing initiative works to account for place (as a balance to historians’ predilection for time) within historical survey, as lab team and students and scholars together develop our database of every bit of surviving evidence for ‘Byzantine’ Constantinople (ca. 200-1500). A second ongoing project–first stage: Geography and Narrative in the Chronicle of Theophanes–has now become a mind-bending project to visualize the contents of medieval chronicles as a social network of historical epistemology: Comparing Chronicles."
