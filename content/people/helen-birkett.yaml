bio: Helen Birkett’s work focuses on the intellectual and religious culture of twelfth-century Britain and Ireland, with a particular interest in literary sources, networks, and communication. Her current research concerns the idea of news in the Middle Ages and seeks to engage with bigger debates going on in early modern and modern scholarship on this topic. She also continues to work on a long-term project concerning the transmission of exempla by the Cistercians of Britain and Ireland c.1200. Prof. Birkett was in residence with us at Wesleyan for the Fall 2017 semester to collaborate on overlapping projects, and explore how to bring our Traveler’s Lab model of student-faculty research collaborations to Exeter University.
