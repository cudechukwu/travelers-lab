bio: "A specialization in Roman and medieval Mediterranean history expands to teaching interests spanning Western and Central Europe, North Africa, Byzantium, and the Middle East. Jasper’s courses emphasize engagement with diverse sources including monuments and art. In her research, Jasper focuses on archaeological excavations near Lake Bolsena, examining economic and trade implications. Her recent book, Bounded Wilderness: Land and Reform at the Hermitage of Fonte Avellana, ca. 1035-1072 (Cornell University Press, 2024), explores the role of land in medieval religious reform, offering insights into economic practices and ecclesiastical property."
