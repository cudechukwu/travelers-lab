bio: A focus on the food supply in the Western Mediterranean culminated in the monograph, Shortage and Famine in the Late Medieval Crown of Aragon. (The Crown of Aragon roughly corresponds to the modern regions of Catalonia, Valencia, Aragon, parts of Languedoc-Roussillon, and the Balearic Islands.) Adam’s current work on communication, news, and travel covers the same region and grows directly out of his curiosity about the transmission of knowledge about grain prices and market conditions during food crises. When governments needed information (including the price of grain), they didn’t want to guess; they sent messengers. Projects include Couriers in the Crown of Aragon, the Datini Letter Collection, and the The Itineraries Project.
order: 1
