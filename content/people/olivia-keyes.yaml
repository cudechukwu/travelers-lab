bio: "Olivia is actively engaged in the Constantinopolitana: Database of East Rome, focusing on unraveling the complexities of Constantinople’s history and is one of the Traveler’s Lab lab managers. Previously, Olivia contributed to the Constantinople Palimpsest project. With a passion for exploring the historical narratives of Eastern Europe and Eurasia, Olivia epitomizes a commitment to interdisciplinary scholarship and uncovering untold stories from the past."
