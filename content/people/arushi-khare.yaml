bio: Arushi Khare, a junior at Wesleyan University, is majoring in the College of Letters with a minor in Film Studies. Her current focus at Traveler’s involves the Seals/Coins category, contributing to the mapping of individuals’ lives in Byzantine Constantinople through these historical elements.
