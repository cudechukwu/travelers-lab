bio: Alex Williams is a sophomore at Wesleyan University, where she is pursuing a major in the College of Letters, an interdisciplinary field intertwining history, literature, and philosophy, alongside a minor in Data Analysis. She is engaged in the CDER (Constantinople Database of East Rome) project at Traveler’s Lab, demonstrating her commitment to interdisciplinary research and digital humanities. Beyond her academic pursuits, Alex indulges in creative writing, reading, and crocheting during her leisure time.
