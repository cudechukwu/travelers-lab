bio: "Simms is the Instructional Technologist for Lafayette College in Easton, PA. His interdisciplinary educational background and interests range from humanities to STEAM: he earned a B.A. in Classics and an M.A. in Anthropology from the University of Tennessee, and an M.P.H. in Environmental Health, a Ph.D. in Applied Anthropology, and a graduate certificate in Geographical Information Systems (GIS) from the University of South Florida. His broad interests within academic computing include data science and visualization, facilitating and energizing interdisciplinary collaboration on teaching and projects, geospatial projects, digital humanities, and more."
